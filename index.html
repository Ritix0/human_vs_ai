<!DOCTYPE html>
<html>
<head>

  <script>
    // БЕЗОПАСНОСТЬ: Умный роутер с проверкой сохраненной сессии
    // Проверяем, есть ли в памяти браузера сохраненный авторизационный токен игрока
    const hasSavedSession = localStorage.getItem('saved_auth_token') !== null;

    // Если нет параметров Телеграм, нет принудительного режима ПК (?pc=true) И нет сохраненной сессии —
    // только тогда перенаправляем на промо-лендинг для модерации Яндекса.
    if (!window.location.search.includes('tgWebAppData') && 
        !window.location.hash.includes('tgWebAppData') && 
        !window.location.search.includes('pc=true') && 
        !hasSavedSession) {
      window.location.href = 'landing.html';
    }
  </script>

  <!-- Самый первый скрипт Telegram (Загружается синхронно для мгновенной инициализации в main.dart) -->
   <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Внутри <head> в web/index.html -->
  <script>window.yaContextCb=window.yaContextCb||[]</script>
  <script src="https://yandex.ru/ads/system/context.js" async></script>
  <script>
    window.showTelegramAd = function(blockId) {
      return new Promise((resolve, reject) => {
        // Умный предохранитель: если за 4 секунды реклама не начала загружаться (например, заблокирована Адблоком) — отменяем ожидание
        const timeout = setTimeout(() => {
          console.warn('[YAN] Загрузка рекламы превысила лимит времени. Возможно, активен AdBlock.');
          reject("adblock"); // Передаем метку блокировщика во Flutter
        }, 4000);

        let adContainer = document.getElementById('yandex_rewarded_container');
        if (!adContainer) {
          adContainer = document.createElement('div');
          adContainer.id = 'yandex_rewarded_container';
          document.body.appendChild(adContainer);
        }

        window.yaContextCb.push(() => {
          Ya.Context.AdvManager.render({
            blockId: blockId,
            type: 'rewarded', // КРИТИЧЕСКИЙ ПАРАМЕТР: указываем Яндексу, что это видео с наградой
            platform: blockId.endsWith('-1') ? 'touch' : 'desktop', // Автоматически ставим touch для мобилок (-1) и desktop для ПК (-2)
            async: true,
            onRender: (info) => {
              clearTimeout(timeout); // Реклама успешно началась, отменяем экстренный таймаут!
              console.log('[YAN] Реклама успешно запущена.');
            },
            onRewarded: () => {
              resolve(true); // Ролик досмотрен
            },
            onError: (err) => {
              clearTimeout(timeout); // Ошибка получена, отменяем таймаут
              console.error('[YAN-ERROR] Детали ошибки Яндекса:', err); // КРИТИЧЕСКОЕ ДОБАВЛЕНИЕ: выведет точную причину в консоль
              reject(err.type || 'error');
            }
          });
        });
      });
    };
  </script>

  <!-- НАМЕРТВО ОТМЕНЯЕМ ВСЕ СТАНДАРТНЫЕ ТАЧ-СОБЫТИЯ ПЕРЕМЕЩЕНИЯ ДЛЯ БРАУЗЕРА -->
  <!-- Это полностью исключает закрытие шторки Telegram при свайпах вниз в любой части экрана -->
  <script>
    document.addEventListener('touchmove', function (e) {
      e.preventDefault();
    }, { passive: false });
  </script>

  <!-- КРИТИЧЕСКИЙ КРОСС-ПЛАТФОРМЕННЫЙ CSS ДЛЯ БЛОКИРОВКИ СВАЙПОВ ТЕЛЕГРАМ -->

      margin: 0;
